name: Build, verify, and publish experiment image

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  container:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check source for credentials
        run: python3 scripts/export_github.py --scan-only
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and load for verification
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: xss-ci:check
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=XSS experiment runtime; source is mounted externally
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify the complete local pipeline before publication
        run: |
          docker run --rm --shm-size=1g \
            -e XSS_UID="$(id -u)" -e XSS_GID="$(id -g)" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace/XSS" \
            xss-ci:check smoke
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified image
        if: github.event_name != 'pull_request' && (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || startsWith(github.ref, 'refs/tags/v'))
        env:
          REPOSITORY: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          docker tag xss-ci:check "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA"
          if [ "$REF_TYPE" = tag ]; then
            docker tag xss-ci:check "$image:$REF_NAME"
            docker push "$image:$REF_NAME"
          else
            docker tag xss-ci:check "$image:latest"
            docker push "$image:latest"
          fi
